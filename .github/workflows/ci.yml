name: KindPath CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, build, and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run API tests
        run: npm test

      # The build script also runs TypeScript checks for frontend and backend.
      - name: Check types and build
        run: npm run build

      - name: Audit production and development dependencies
        run: npm audit --include=dev --audit-level=low

      - name: Audit isolated worker dependencies
        run: npm --prefix scanner audit --audit-level=low

      - name: Build scanner, browser QA and firewall images
        run: npm run scanner:build

      - name: Verify isolation and real fixture scans
        run: npm run test:scanner

      - name: Verify gateway destination policy without network
        run: npm run test:gateway:unit

      - name: Verify private socket gateway isolation
        run: npm run test:gateway

      - name: Verify independent firewall using controlled fixtures
        run: npm run test:firewall

      - name: Verify fixture snapshot preview in an isolated browser
        run: npm run test:preview
