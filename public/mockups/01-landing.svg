xt x="697" y="235" fill="#173e38" font-size="20" font-family="Georgia,serif">fern &amp; form</text><text x="697" y="284" fill="#173e38" font-size="8" font-family="Arial,sans-serif">A LITTLE ROOM TO GROW</text><text x="697" y="325" fill="#173e38" font-size="31" font-family="Georgia,serif">Good things.</text><text x="697" y="360" fill="#173e38" font-size="31" font-family="Georgia,serif">Growing slowly.</text><text x="697" y="390" fill="#173e38" font-size="10" font-family="Arial,sans-serif">Thoughtful objects for a greener home.</text><rect x="697" y="415" width="144" height="33" rx="0" fill="#314e37" stroke="none"/><text x="709" y="436" fill="white" font-size="10" font-family="Arial,sans-serif">Explore the collection  ↗</text><g transform="translate(930,255)"><ellipse cx="75" cy="200" rx="80" ry="15" fill="#d8d9c5"/><path d="M40 120H115L103 200H52Z" fill="#b97750"/><path d="M77 125C-20 50 20 10 77 125M77 125C75 -15 135 0 77 125M77 125C170 20 195 80 77 125" fill="#607b44"/></g><text x="697" y="502" fill="#173e38" font-size="8" font-family="Arial,sans-serif">ADVERTISEMENT · STATIC PLACEHOLDER</text><text x="675" y="549" fill="#173e38" font-size="11" font-family="Arial,sans-serif">Same website. Different experience.</text><path d="M65 660H1140" stroke="#dce1d8"/><text x="65" y="700" fill="#173e38" font-size="10" font-family="Arial,sans-serif">01 / DISCOVER</text><text x="65" y="743" fill="#173e38" font-size="25" font-family="Georgia,serif">Find the barriers.</text><text x="65" y="778" fill="#56665f" font-size="13" font-family="Arial,sans-serif">Clear findings with useful context.</text><text x="445" y="700" fill="#173e38" font-size="10" font-family="Arial,sans-serif">02 / SEE DIFFERENTLY</text><text x="445" y="743" fill="#173e38" font-size="25" font-family="Georgia,serif">Change your perspective.</text><text x="445" y="778" fill="#56665f" font-size="13" font-family="Arial,sans-serif">Explore illustrative visual effects.</text><text x="825" y="700" fill="#173e38" font-size="10" font-family="Arial,sans-serif">03 / MAKE PROGRESS</text><text x="825" y="743" fill="#173e38" font-size="25" font-family="Georgia,serif">Know your next step.</text><text x="825" y="778" fill="#56665f" font-size="13" font-family="Arial,sans-serif">Small, practical improvements.</text></svg>