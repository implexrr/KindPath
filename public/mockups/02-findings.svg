<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title"><title id="title">KindPath demo findings mockup</title><rect x="0" y="0" width="1200" height="820" rx="0" fill="#fafaf6" stroke="none"/><text x="65" y="52" fill="#173e38" font-size="25" font-family="Arial,sans-serif">k↗ KindPath</text><text x="900" y="50" fill="#173e38" font-size="13" font-family="Arial,sans-serif">How it works    ↗</text><path d="M60 80H1140" stroke="#dce1d8"/><text x="65" y="135" fill="#173e38" font-size="10" font-family="Arial,sans-serif">YOUR EXPLORATION</text><text x="65" y="183" fill="#173e38" font-size="39" font-family="Georgia,serif">Small changes. Meaningful impact.</text><text x="65" y="218" fill="#173e38" font-size="13" font-family="Arial,sans-serif">Submitted URL: https://example.com</text><rect x="65" y="244" width="1070" height="48" rx="8" fill="#f6f3e7" stroke="none"/><text x="83" y="273" fill="#173e38" font-size="13" font-family="Arial,sans-serif">Demo data — these findings are not an assessment of the submitted website.</text><text x="65" y="330" fill="#173e38" font-size="14" font-family="Arial,sans-serif">Accessibility findings  3</text><text x="300" y="330" fill="#173e38" font-size="14" font-family="Arial,sans-serif">Visual preview  ◉</text><path d="M65 347H1135" stroke="#dce1d8"/><rect x="65" y="375" width="685" height="118" rx="7" fill="white" stroke="#dce1d8"/><text x="85" y="410" fill="#173e38" font-size="22" font-family="Georgia,serif">01</text><text x="133" y="402" fill="#854122" font-size="9" font-family="Arial,sans-serif">SERIOUS</text><text x="133" y="431" fill="#173e38" font-size="18" font-family="Arial,sans-serif">Give every form field a clear label</text><text x="133" y="454" fill="#56665f" font-size="11" font-family="Arial,sans-serif">Example newsletter · email input</text><text x="133" y="477" fill="#173e38" font-size="12" font-family="Arial,sans-serif">▸ How to improve this</text><rect x="65" y="510" width="685" height="118" rx="7" fill="white" stroke="#dce1d8"/><text x="85" y="545" fill="#173e38" font-size="22" font-family="Georgia,serif">02</text><text x="133" y="537" fill="#854122" font-size="9" font-family="Arial,sans-serif">SERIOUS</text><text x="133" y="566" fill="#173e38" font-size="18" font-family="Arial,sans-serif">Make supporting text easier to read</text><text x="133" y="589" fill="#56665f" font-size="11" font-family="Arial,sans-serif">Example product card · description</text><text x="133" y="612" fill="#173e38" font-size="12" font-family="Arial,sans-serif">▸ How to improve this</text><rect x="65" y="645" width="685" height="118" rx="7" fill="white" stroke="#dce1d8"/><text x="85" y="680" fill="#173e38" font-size="22" font-family="Georgia,serif">03</text><text x="133" y="672" fill="#854122" font-size="9" font-family="Arial,sans-serif">MODERATE</text><text x="133" y="701" fill="#173e38" font-size="18" font-family="Arial,sans-serif">Describe where your links lead</text><text x="133" y="724" fill="#56665f" font-size="11" font-family="Arial,sans-serif">Example article · link text</text><text x="133" y="747" fill="#173e38" font-size="12" font-family="Arial,sans-serif">▸ How to improve this</text><rect x="785" y="375" width="350" height="385" rx="8" fill="#e9eedf" stroke="none"/><text x="812" y="429" fill="#173e38" font-size="32" font-family="Arial,sans-serif">✳</text><text x="812" y="479" fill="#173e38" font-size="31" font-family="Georgia,serif">People complete</text><text x="812" y="519" fill="#173e38" font-size="31" font-family="Georgia,serif">the picture.</text><text x="812" y="568" fill="#173e38" font-size="13" font-family="Arial,sans-serif">Automated checks are a starting point.</text><text x="812" y="601" fill="#173e38" font-size="13" font-family="Arial,sans-serif">Try keyboard-only navigation.</text><text x="812" y="634" fill="#173e38" font-size="13" font-family="Arial,sans-serif">Review with a screen reader.</text><text x="812" y="667" fill="#173e38" font-size="13" font-family="Arial,sans-serif">Include disabled people in testing.</text></svg>